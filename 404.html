<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page not found</title>
    <script>
      (function () {
        var path = location.pathname;
        var search = location.search;
        var hash = location.hash;
        function go(rest) {
          location.replace("https://plainviewbaptist.github.io/" + rest + search + hash);
        }
        if (path === "/plainview" || path.indexOf("/plainview/") === 0) {
          var after = path.slice("/plainview".length);
          if (after.charAt(0) === "/") after = after.slice(1);
          go(after);
          return;
        }
        if (path === "/join" || path.indexOf("/join/") === 0) {
          go(path.replace(/^\//, ""));
        }
      })();
    </script>
  </head>
  <body>
    <p>Page not found</p>
  </body>
</html>
