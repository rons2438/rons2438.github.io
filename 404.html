<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page not found</title>
    <script>
      // Place this file at the root of rons2438.github.io as /404.html.
      // GitHub Pages uses that one file for every missing path.
      // Only /plainview/ is sent into the app. /flightlog/ and every other path stay here.
      // Query encoding matches https://github.com/rafgraph/spa-github-pages (MIT)
      // and shared/spa-redirect.ts.
      (function () {
        var l = window.location;
        var path = l.pathname;
        if (path !== "/plainview" && path.indexOf("/plainview/") !== 0) return;
        var keep = 1;
        var prefix = path.split("/").slice(0, 1 + keep).join("/");
        var rest = path.slice(1).split("/").slice(keep).join("/").replace(/&/g, "~and~");
        var search = l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "";
        l.replace(
          l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          prefix + "/?/" + rest + search + l.hash
        );
      })();
    </script>
  </head>
  <body>
    <p>Page not found</p>
  </body>
</html>
